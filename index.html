<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer">
    <title>酷安</title>
    <style>
      html, body {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
    </style>
    <!-- iOS 13 启动诊断（临时排查件，定位完成后连同 public/boot-diagnostics.js 一起删除）。
         必须是同源外部脚本且早于入口模块加载：CSP 的 script-src 没有 'unsafe-inline'，
         内联脚本会被拦掉；module 是延迟执行，赶不上入口模块解析失败的情况。 -->
    <script src="/boot-diagnostics.js"></script>
  </head>
  <body>
    <!-- 静态探针：这一段不依赖任何 JS，只要 HTML 与 CSS 被渲染出来就应该出现。
         放在 #app 之前而不是里面，因为 Vue 挂载时会清空 #app 的子节点。
         点不到（pointer-events:none），不会拦住下面的按钮。
         内容会被 /boot-diagnostics.js 每秒改写成带计数器的形式；
         如果这里一直停在 "HTML-OK"，说明脚本没执行或主线程已死。 -->
    <div
      id="__boot_probe__"
      style="position:fixed;left:0;top:0;right:0;z-index:2147483647;background:#ffd400;color:#000;border-bottom:2px solid #000;font:12px/1.35 ui-monospace,Menlo,monospace;padding:3px 6px;white-space:pre-wrap;pointer-events:none;-webkit-user-select:none;"
    >[HTML-OK]</div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
